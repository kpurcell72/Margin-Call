name: NFL Data Sync

on:
  schedule:
    # Tuesdays at 9:00 AM EST (14:00 UTC) to fetch fixed spreads
    - cron: '0 14 * * 2'
    # Sundays every 15 minutes between 1:00 PM EST and 11:00 PM EST (18:00 to 03:00 UTC)
    - cron: '*/15 18-23 * * 0'
    - cron: '*/15 0-3 * * 1'
  workflow_dispatch: # Allows manual run button in GitHub UI

jobs:
  sync-nfl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_nfl.py
